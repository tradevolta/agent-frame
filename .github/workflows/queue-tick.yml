# Heartbeat for the order retry queue: every 10 minutes, ask the site to submit
# any AI work that is due for a retry. Safe to run often: the endpoint only
# submits work that is already due and rate-limits itself.
# Set the repository variable APP_URL if the site moves to another domain.
name: Queue tick
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: curl -fsS --max-time 300 "${APP_URL:-https://www.realagentframe.com}/api/queue/tick"
        env:
          APP_URL: ${{ vars.APP_URL }}
